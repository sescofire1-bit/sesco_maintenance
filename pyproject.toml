[project]
name = "sesco_maintenance"
authors = [{ name = "SESCO" }]
description = "Maintenance of customer-owned equipment (fire extinguishers first) on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
